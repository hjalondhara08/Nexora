version: '3.8'

services:
  # 1. PostgreSQL with PGVector for Chat Persistence & Conversation Memory
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexora-postgres
    restart: always

    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_password
      POSTGRES_DB: nexora_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Qdrant Vector Store for Dense Document Embeddings & Hybrid RAG
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nexora-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Full Application (FastAPI Async Backend + React Frontend SPA)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
    
      - POSTGRES_URL=postgresql://nexora:nexora_password@postgres:5432/nexora_db
      - QDRANT_URL=http://qdrant:6333
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-C9PE94QUEW9VWGFM}
      - NEXORA_API_KEY=${NEXORA_API_KEY:-nexora-secret-key-2026}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
  qdrant_storage:
